name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        shell: bash
        run: |
          python -m pytest -q 2>&1 | tee pytest-output.txt
          exit ${PIPESTATUS[0]}
      # TEMPORARY debug step (removed before final merge): surface failing
      # pytest output where it can be read without Actions log access.
      - name: Report failure details
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "CI failure: ${{ matrix.os }} / py${{ matrix.python-version }}"
            echo '```'
            tail -c 60000 pytest-output.txt
            echo '```'
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md || true
